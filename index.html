<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Varistor EOPMS - Employee Operations & Performance Management System. Features include employee dashboard, Kanban task board, and Vari Points ledger." />
    <title>Varistor EOPMS - Employee Operations & Performance Management System</title>
    <script>
      (function () {
        var saved = localStorage.getItem('eopms_theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (saved !== 'light' && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
